<div class="max-w-5xl mx-auto relative mt-16 content">
    <article class="pt-16 max-w-2xl mx-auto content">
        <h1>Subjects</h1>
        <p>Browse activities by subject to explore the different areas of learning and study happening at the school.</p>
    </article>
</div>

<div class="max-w-5xl mx-auto mb-32">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {{ taxonomy:subjects }}
        <div class="bg-white border border-gray-200 rounded-lg p-6 hover:shadow-lg transition-shadow">
            <h3 class="text-xl font-semibold mb-3">
                <a href="/subjects/{{ slug }}" class="text-purple-600 hover:text-purple-800">{{ title }}</a>
            </h3>
            
            {{ if content }}
            <p class="text-gray-600 mb-4">{{ content | strip_tags | truncate:100 }}</p>
            {{ /if }}
            
            <div class="text-sm text-gray-500">
                <div><strong>{{ entries | length }}</strong> activities recorded</div>
            </div>
        </div>
        {{ /taxonomy:subjects }}
    </div>
</div>
